<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}

.leaflet-tile::selection {

}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {
	width: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

	}

	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}

	visibility: hidden;
	}

	visibility: inherit;
	}

	width: 0;

	-moz-box-sizing: border-box;
	     box-sizing: border-box;

	}

.leaflet-overlay-pane svg {

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	pointer-events: none;
	}
.leaflet-top {
	top: 0;

.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;

.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}

	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);

.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,

.leaflet-container {

	}
.leaflet-zoom-box {

/* general typography */
.leaflet-container {

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

	}
.leaflet-bar a {
	background-color: #fff;

	display: block;
	text-align: center;

.leaflet-bar a,
.leaflet-control-layers-toggle {

.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}
.leaflet-bar a:last-child {

	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {

	}

.leaflet-control-layers {

	background-image: url(images/marker-icon.png);

.leaflet-touch .leaflet-control-attribution,

.leaflet-touch .leaflet-bar {

.leaflet-touch .leaflet-control-layers,

.leaflet-popup {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

	}

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

.leaflet-tooltip-left:before,

<style>
/* Layout: full-height split — ride ledger on the left, map filling the rest, elevation strip docked under the map. */
:root{
  --bg:#f3ebe1; --panel:#fbf7f2; --ink:#2a1d17; --muted:#7b665a; --line:#e2d4c5;
  --accent:#b4471f; --mapbg:#e8d6c2; --casing:#1b1418; --chip:#efe3d6;
  --d14:#ff2e93; --d15:#ffe14d; --d16:#00e0ff; --d17:#7dff5c; --d18:#b98cff;
  --halt:#b3a69d; --walk:#14d6a0; --trot:#ff9419; --canter:#ff3434;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131a; --panel:#1f1a22; --ink:#f1e6da; --muted:#a8978b; --line:#352d36;
  --accent:#f08a5d; --mapbg:#2a2129; --casing:#0b080b; --chip:#2b242d;
  --d14:#ff2e93; --d15:#ffe14d; --d16:#00e0ff; --d17:#7dff5c; --d18:#b98cff;
  --halt:#b3a69d; --walk:#14d6a0; --trot:#ff9419; --canter:#ff3434; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131a; --panel:#1f1a22; --ink:#f1e6da; --muted:#a8978b; --line:#352d36;
  --accent:#f08a5d; --mapbg:#2a2129; --casing:#0b080b; --chip:#2b242d;
  --d14:#ff2e93; --d15:#ffe14d; --d16:#00e0ff; --d17:#7dff5c; --d18:#b98cff;
  --halt:#b3a69d; --walk:#14d6a0; --trot:#ff9419; --canter:#ff3434; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:18px 0}
.back{font:500 12px var(--mono);color:var(--accent);text-decoration:none;display:inline-block;margin-bottom:10px}
.back:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:13px}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 14px;padding:12px 0;border-block:1px solid var(--line)}
.totals div{display:flex;flex-direction:column;gap:2px}
.totals b{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font:500 12px var(--body);padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,.ride:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:10px;min-height:18px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:5px;border-radius:2px;display:inline-block}
.list{overflow:auto;min-height:0;flex:1;margin:0 -16px 0 0;padding:0 16px 16px 0}
.day{margin-top:12px}
.day h2{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.day h2 i{width:10px;height:10px;border-radius:50%}
.ride{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.ride:hover{background:var(--chip)}
.ride.sel{background:var(--chip);border-color:var(--line)}
.ride.off .nm,.ride.off .st{opacity:.45}

Object.values(bases).forEach(l=>l&&l.on('tileload',()=>{tileOk=true;note.hidden=true}).on('tileerror',()=>{tileErr++;if(!tileOk&&tileErr>2)note.hidden=false}));

  document.querySelectorAll('#baseSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b));}
document.getElementById('baseSeg').onclick=e=>{const b=e.target.dataset.b;if(b)setBase(b)};

let mode='day',sel=null;
const groups={};
function eleColor(e){const k=(e-EMIN)/(EMAX-EMIN);const stops=[[47,125,109],[217,130,43],[192,57,43],[120,40,60]];
  const x=Math.min(.999,Math.max(0,k))*(stops.length-1),i=Math.floor(x),f=x-i,a=stops[i],b=stops[i+1];
  return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')})`;}
function runs(pts,keyf){const out=[];let cur=null,k=null;
  pts.forEach((p,i)=>{const kk=keyf(p);if(kk!==k){if(cur){cur.pts.push([p[1],p[0]]);out.push(cur)}cur={k:kk,pts:[]};k=kk}cur.pts.push([p[1],p[0]])});
  if(cur&&cur.pts.length>1)out.push(cur);return out;}
function build(){
  Object.values(groups).forEach(g=>map.removeLayer(g));
  DATA.forEach(t=>{
    const g=L.layerGroup();const isSel=sel===t.id,dim=sel&&!isSel;
    const w=isSel?5:3.2,op=dim?.35:.95;
    if(isSel) L.polyline(t.pts.map(p=>[p[1],p[0]]),{color:css('--panel'),weight:w+4,opacity:.9}).addTo(g);
    if(mode==='day'){
      L.polyline(t.pts.map(p=>[p[1],p[0]]),{color:css('--casing'),weight:w+2.5,opacity:dim?.25:.7}).addTo(g);
      L.polyline(t.pts.map(p=>[p[1],p[0]]),{color:css(dayVar(t.id)),weight:w,opacity:op}).addTo(g);
    }else if(mode==='gait'){
      const gw=isSel?7:5;
      L.polyline(t.pts.map(p=>[p[1],p[0]]),{color:css('--casing'),weight:gw+2.5,opacity:dim?.25:.7}).addTo(g);
      runs(t.pts,p=>p[5]||'H').forEach(r=>L.polyline(r.pts,{color:css(GAITS.find(x=>x[0]===r.k)[2]),weight:gw,opacity:op}).addTo(g));
    }else{
      runs(t.pts,p=>Math.round((p[2]-EMIN)/(EMAX-EMIN)*20)).forEach(r=>L.polyline(r.pts,{color:eleColor(EMIN+r.k/20*(EMAX-EMIN)),weight:w,opacity:op}).addTo(g));
    }
    const s=t.pts[0],e=t.pts[t.pts.length-1];
    L.circleMarker([s[1],s[0]],{radius:isSel?6:4,color:css('--panel'),weight:2,fillColor:css(dayVar(t.id)),fillOpacity:1,opacity:dim?.4:1})
      .bindTooltip(`${label(t.id)} start · ${fmtT(t.t0)}`).addTo(g);
    L.circleMarker([e[1],e[0]],{radius:isSel?6:4,color:css(dayVar(t.id)),weight:2.5,fillColor:css('--panel'),fillOpacity:1,opacity:dim?.4:1})
      .bindTooltip(`${label(t.id)} end · ${fmtT(t.t1)}`).addTo(g);
    // invisible hit line for clicks
    L.polyline(t.pts.map(p=>[p[1],p[0]]),{opacity:0,weight:14}).on('click',()=>select(t.id)).bindTooltip(`${dateStr(t)} · ${label(t.id)}`,{sticky:true}).addTo(g);
    groups[t.id]=g; if(t.on) g.addTo(map);

  else el.innerHTML=`<span>${Math.round(EMIN)} m</span><span><i style="width:120px;height:6px;background:linear-gradient(90deg,${[0,.33,.66,1].map(k=>eleColor(EMIN+k*(EMAX-EMIN))).join(',')})"></i></span><span>${Math.round(EMAX)} m</span>`;
}

  sel=id;document.querySelectorAll('.ride').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));

    map.fitBounds(L.latLngBounds(t.pts.map(p=>[p[1],p[0]])),{padding:[40,40],maxZoom:16});}

  const lo=Math.floor(Math.min(...v.map(d=>d.e))/50)*50,hi=Math.ceil(Math.max(...v.map(d=>d.e))/50)*50;
  const X0=44,X1=W-8,Y0=6,Y1=H-18,xmax=v[v.length-1].x;
  const sx=x=>X0+x/xmax*(X1-X0),sy=e=>Y1-(e-lo)/(hi-lo||1)*(Y1-Y0);
  chartGeom={s:v,sx,sy,xmax,X0,X1};
  ctx.font='11px "IBM Plex Mono",monospace';ctx.fillStyle=css('--muted');ctx.strokeStyle=css('--line');ctx.lineWidth=1;
  const step=(hi-lo)>300?100:50;
  for(let e=lo;e<=hi;e+=step){const y=Math.round(sy(e))+.5;ctx.beginPath();ctx.moveTo(X0,y);ctx.lineTo(X1,y);ctx.stroke();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(e+' m',X0-6,y)}
  const kst=[500,1000,2000,5000,10000,20000].find(k=>(X1-X0)/(xmax/k)>=56)||20000;ctx.textAlign='center';ctx.textBaseline='top';
  for(let k=0;k<=xmax;k+=kst)ctx.fillText((k/1000)+' km',Math.min(X1-14,Math.max(X0+10,sx(k))),Y1+4);
  // area by segment colour
  let seg=[];const flush=()=>{if(seg.length<2){seg=[];return}const c=colorFor(seg[0]);
    ctx.beginPath();ctx.moveTo(sx(seg[0].x),Y1);seg.forEach(d=>ctx.lineTo(sx(d.x),sy(d.e)));ctx.lineTo(sx(seg[seg.length-1].x),Y1);ctx.closePath();
    ctx.globalAlpha=.18;ctx.fillStyle=c;ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();seg.forEach((d,i)=>i?ctx.lineTo(sx(d.x),sy(d.e)):ctx.moveTo(sx(d.x),sy(d.e)));ctx.strokeStyle=c;ctx.lineWidth=1.6;ctx.stroke();seg=[]};
  let lastK=null;
  s.forEach(d=>{if(!d){flush();lastK=null;return}const k=keyFor(d);if(lastK!==null&&k!==lastK){seg.push(d);flush()}seg.push(d);lastK=k});flush();
  if(hx!=null){ctx.strokeStyle=css('--ink');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx+.5,Y0);ctx.lineTo(hx+.5,Y1);ctx.stroke()}
}
function keyFor(d){return mode==='gait'?(d.p[5]||'H'):mode==='ele'?Math.round((d.e-EMIN)/(EMAX-EMIN)*10):d.t.id}
function colorFor(d){return mode==='gait'?css(GAITS.find(g=>g[0]===(d.p[5]||'H'))[2]):mode==='ele'?eleColor(d.e):css(dayVar(d.t.id))}
function onMove(ev){if(!chartGeom)return;const r=cv.getBoundingClientRect(),px=ev.clientX-r.left;
  const {s,X0,X1,xmax,sx}=chartGeom;const x=Math.max(0,Math.min(1,(px-X0)/(X1-X0)))*xmax;
  let lo=0,hi=s.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(s[m].x<x)lo=m;else hi=m}const d=s[hi];
  drawChart(sx(d.x));
  const gname=(GAITS.find(g=>g[0]===(d.p[5]||'H'))||[])[1];
  document.getElementById('readout').textContent=`${label(d.t.id)} ${dateStr(d.t)} · ${fmtT(d.p[3])} · ${(d.p[4]/1000).toFixed(2)} km · ${Math.round(d.e)} m · ${gname}`;
  const ll=[d.p[1],d.p[0]];
  if(!hoverMk)hoverMk=L.circleMarker(ll,{radius:7,color:css('--ink'),weight:2,fillColor:css('--panel'),fillOpacity:1}).addTo(map);else hoverMk.setLatLng(ll);
}
cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerdown',onMove);
cv.addEventListener('pointerleave',()=>{drawChart();if(hoverMk){map.removeLayer(hoverMk);hoverMk=null}});

const allBounds=L.latLngBounds(DATA.flatMap(t=>[[t.pts[0][1],t.pts[0][0]]]).concat(DATA.flatMap(t=>t.pts.filter((_,i)=>i%20==0).map(p=>[p[1],p[0]]))));
map.fitBounds(allBounds,{padding:[24,24]});
setBase('sat');build();drawChart();
addEventListener('resize',()=>{drawChart();map.invalidateSize()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{build();drawChart()});
new MutationObserver(()=>{build();drawChart()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
